# Application Configuration
spring.application.name=proyapirest
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/proy_lvl
spring.datasource.username=jira_user
spring.datasource.password=jira_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=MiClaveSecretaSuperSeguraParaJWTDeProyLVL2026DebeSerMuyLargaYCompleja123456!@#
jwt.expiration=86400000

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.com.example.proyapirest=DEBUG
logging.level.org.springframework.security=DEBUG

# Error Handling
server.web.error.include-message=always
server.web.error.include-binding-errors=always
server.web.error.include-stacktrace=on_param
server.web.error.include-exception=false