version: '3.8'

services:
  
  postgres:
    image: postgres:15-alpine
    container_name: proy_lvl_postgres
    environment:
      POSTGRES_DB: proy_lvl
      POSTGRES_USER: jira_user
      POSTGRES_PASSWORD: jira_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - proy_lvl_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jira_user -d proy_lvl"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: proy_lvl_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@proylvl.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - proy_lvl_network
    restart: unless-stopped

  
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proy_lvl_app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/proy_lvl
      SPRING_DATASOURCE_USERNAME: jira_user
      SPRING_DATASOURCE_PASSWORD: jira_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - proy_lvl_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  proy_lvl_network:
    driver: bridge